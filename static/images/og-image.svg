<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f0f14"/>
  
  <!-- Subtle background glow orbs -->
  <circle cx="200" cy="150" r="300" fill="#ff6b6b" opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="500" r="350" fill="#34d399" opacity="0.10" filter="blur(100px)"/>
  <circle cx="900" cy="150" r="250" fill="#8b5cf6" opacity="0.12" filter="blur(80px)"/>

  <!-- Card Frame -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#181824" stroke="#2e2e42" stroke-width="2"/>
  
  <!-- Brand Emblem -->
  <g transform="translate(140, 160)">
    <rect width="72" height="72" rx="20" fill="#262636" stroke="#3f3f5a"/>
    <path d="M36 16L52 36L36 56L20 36Z" fill="url(#brand-grad)"/>
    <circle cx="36" cy="36" r="4" fill="#ffffff"/>
  </g>
  
  <!-- Title Text -->
  <text x="236" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff">ProjectHub</text>
  <text x="236" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#f59e0b">STUDENT PROJECT REVIEWS &amp; PEER FEEDBACK</text>

  <!-- Main Headline -->
  <text x="140" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#ffffff">Build Together, Grow Together</text>
  <text x="140" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#a1a1aa">Showcase your coding projects, receive structured peer reviews, and elevate your skills.</text>
  
  <!-- Footer Tagline -->
  <rect x="140" y="450" width="220" height="42" rx="21" fill="#ff6b6b" opacity="0.15"/>
  <text x="160" y="477" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#ff6b6b">◆ projecthub.com</text>

  <defs>
    <linearGradient id="brand-grad" x1="20" y1="16" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#ff8e53"/>
      <stop offset="1" stop-color="#ffa726"/>
    </linearGradient>
  </defs>
</svg>
